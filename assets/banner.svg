<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="340" viewBox="0 0 1200 340" style="background:linear-gradient(135deg,#0d1117 0,#161b22 50%,#0a0e17 100%);border-radius:14px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#6366f1"/><stop offset="100%" stop-color="#a855f7"/></linearGradient><linearGradient id="badgeGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#2563eb"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/><stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="pulseGlow" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="10"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes waveFlow{0%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-12px) scaleY(1.05)}}@keyframes pulseScale{0%{r:160px;opacity:.12}50%{r:210px;opacity:.22}}@keyframes pingRing{0%{r:35px;opacity:.8;stroke-width:3px}80%{r:105px;opacity:0;stroke-width:1px}}@keyframes nfcPulse{0%{opacity:.2;stroke-width:2.5}50%{opacity:.9;stroke-width:3.5;stroke:#38bdf8}}@keyframes floatTerminal{0%{transform:translateY(0)}}@keyframes chipFlash{0%{filter:drop-shadow(0 0 2px #f59e0b)}}@keyframes floatTag{0%{transform:translateY(0)}}.bg-wave{animation:waveFlow 12s ease-in-out infinite alternate}.pulse-circle{animation:pulseScale 3.5s ease-in-out infinite alternate}.ping-wave{animation:pingRing 3s cubic-bezier(0,.2,.8,1) infinite;transform-origin:1040px 1